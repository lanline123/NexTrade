packages:
  - "pc-semi"

# 说明：本文件是 rust/web 的前端 pnpm workspace 根。
# - 与 rust/crates（Rust cargo workspace）完全独立，互不影响。
# - 2026-11 清理：原 Vue3 重写原型 admin / pc / shared 已按
#   rust/docs/FRONTEND-1TO1-REVIEW-2026-10-25.md 的 R3 决策移除，
#   当前线上前端为 admin-semi（React，独立 npm 安装）与 pc-semi（Next.js）。
# - admin-semi 使用独立的 package-lock.json，不纳入 pnpm workspace。

# 允许执行构建脚本的依赖：
# - esbuild：Vite 的底层打包器，必须编译原生二进制
allowBuilds:
  '@parcel/watcher': true
  esbuild: true